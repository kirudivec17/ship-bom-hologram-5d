<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>REAL SHIP HOLOGRAM - CENTERED</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000510;color:#0ff;font-family:monospace;overflow:hidden;height:100dvh;display:flex;flex-direction:column}
header{background:#001122;border-bottom:2px solid #0ff;padding:8px;display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap}
header button{border:1px solid #0ff;background:#002040;color:#0ff;padding:8px 12px;white-space:nowrap;font-size:11px}
header button.active{background:#0ff;color:#000}
#main{flex:1;display:flex;min-height:0;position:relative}
#left{width:220px;background:#001122;border-right:2px solid #0ff;padding:10px;overflow-y:auto}
#left h3{color:#fff;font-size:11px;margin:10px 0 6px}
.stage{border:1px solid #0ff;padding:8px;margin-bottom:6px;font-size:11px;line-height:1.5;cursor:pointer}
.stage.active{background:#0ff;color:#000}
#viewport{flex:1;position:relative;background:radial-gradient(circle at center,#001a33 0%,#000 75%)}
canvas{display:block;width:100%!important;height:100%!important}
#centerTag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:1px dashed rgba(0,255,255,.3);width:90%;height:80%;pointer-events:none;display:none}
#hud{position:absolute;left:10px;bottom:10px;background:rgba(0,20,40,.92);border:1px solid #0ff;padding:10px;font-size:11px;line-height:1.6;max-width:92%}
#vesselInfo{position:absolute;right:10px;top:10px;background:rgba(0,20,40,.92);border:1px solid #0ff;padding:8px;font-size:11px;text-align:right}
#footer{background:#001122;border-top:2px solid #0ff;padding:10px}
#footer input{width:100%;accent-color:#0ff}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#001122;border:1px solid #0ff;padding:15px;text-align:center;z-index:99}
@media(max-width:768px){#left{position:absolute;left:0;top:0;bottom:0;z-index:20;width:200px;transform:translateX(-100%);transition:.3s}#left.open{transform:none}#viewport{width:100%}#menuBtn{display:block!important}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header>
<button id="menuBtn" style="display:none" onclick="document.getElementById('left').classList.toggle('open')">☰ MENU</button>
<button onclick="setVessel('container')" class="vbtn active">CONTAINER</button>
<button onclick="setVessel('bulk')" class="vbtn">BULK CARRIER</button>
<button onclick="setVessel('tanker')" class="vbtn">OIL TANKER</button>
<button onclick="setVessel('lng')" class="vbtn">LNG</button>
<button onclick="setVessel('roro')" class="vbtn">RO-RO</button>
<button onclick="setVessel('cruise')" class="vbtn">CRUISE</button>
<button onclick="toggleWire()">WIREFRAME</button>
<button onclick="toggleCut()">CUTAWAY</button>
<button onclick="playBuild()">▶️ PLAY BUILD</button>
</header>
<div id="main">
<div id="left">
<h3>5 BLOCKS - REAL SHIP</h3>
<div id="blockList"></div>
<h3>BUILD SEQUENCE - KEEL TO DELIVERY</h3>
<div id="stageList"></div>
</div>
<div id="viewport">
<div id="loading">🚢 REAL SHIP MODEL LOADING...<br>GLB Hologram Engine<br>Please wait 5 sec</div>
<div id="centerTag"></div>
<div id="vesselInfo">CONTAINER VESSEL<br>LOA 200m | BEAM 32.2m<br>DRAFT 12.5m</div>
<div id="hud">CENTERED HOLOGRAM<br>Drag to Rotate | Pinch to Zoom<br>Ship is now in CENTRE</div>
</div>
</div>
<div id="footer"><div style="display:flex;justify-content:space-between;font-size:10px"><span>KEEL</span><span id="stageTxt">STAGE 0: KEEL</span><span>DELIVERY</span></div><input type="range" id="slider" min="0" max="10" value="0"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let scene,camera,renderer,controls,shipGroup,realShip,cut=false,wire=false,curStage=0,curVessel='container';
scene=new THREE.Scene();
scene.background=new THREE.Color(0x000510);
// CENTER FIX - Camera bilkul centre pe
let vp=document.getElementById('viewport');
camera=new THREE.PerspectiveCamera(45, vp.clientWidth/vp.clientHeight, 0.1, 500);
camera.position.set(0, 2, 12); // Bilkul centre ke samne
camera.lookAt(0,0,0);
renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(vp.clientWidth, vp.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
vp.appendChild(renderer.domElement);

// REAL LIGHTING - Real jaisa lagega, cartoon nahi
scene.add(new THREE.AmbientLight(0x88ccff, 0.8));
let sun=new THREE.DirectionalLight(0xffffff,2.5); sun.position.set(10,15,10); scene.add(sun);
let rim=new THREE.DirectionalLight(0x00ffff,1.5); rim.position.set(-10,5,-10); scene.add(rim);
let grid=new THREE.GridHelper(40,40,0x004466,0x001122); grid.position.y=-2.2; scene.add(grid);
// Reflection floor - Photo jaisa chamak
let floor=new THREE.Mesh(new THREE.CircleGeometry(8,64), new THREE.MeshBasicMaterial({color:0x001133,transparent:true,opacity:0.4}));
floor.rotation.x=-Math.PI/2; floor.position.y=-2.19; scene.add(floor);

controls=new OrbitControls(camera, renderer.domElement);
controls.target.set(0,0,0); // YEHI CENTRE FIX HAI - Target 0,0,0
controls.enableDamping=true; controls.minDistance=4; controls.maxDistance=20;
controls.update();

shipGroup=new THREE.Group(); scene.add(shipGroup);

// --- REAL SHIP BUILDER - Box nahi, Real Hull Shape ---
function createRealHull(color=0x0066cc){
  let g=new THREE.Group();
  // Hull - Extrude se asli shape, box nahi
  let shape=new THREE.Shape();
  shape.moveTo(-6,-0.5);
  shape.lineTo(5,-0.5); shape.quadraticCurveTo(6.5,-0.3,6.8,0.2); // Bow pointed
  shape.lineTo(6.2,1); shape.lineTo(-6,1); shape.quadraticCurveTo(-6.5,0,-6,-0.5);
  let hullGeo=new THREE.ExtrudeGeometry(shape,{depth:1.6,bevelEnabled:true,bevelThickness:0.15,bevelSize:0.15,bevelSegments:3});
  let hullMat=new THREE.MeshStandardMaterial({color,metalness:0.7,roughness:0.3});
  let hull=new THREE.Mesh(hullGeo,hullMat); hull.rotation.y=Math.PI/2; hull.position.set(0,0,-0.8);
  // Wireframe overlay - Hologram feel
  let wire=new THREE.LineSegments(new THREE.EdgesGeometry(hullGeo), new THREE.LineBasicMaterial({color:0x00ffff,transparent:true,opacity:0.4}));
  wire.rotation.copy(hull.rotation); wire.position.copy(hull.position);
  g.add(hull); g.add(wire);
  return g;
}
function addRealPart(geo,mat,pos,rot=[0,0,0]){
  let m=new THREE.Mesh(geo,mat); m.position.set(...pos); m.rotation.set(...rot); shipGroup.add(m);
  let w=new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color:0x00ffff,transparent:true,opacity:0.25}));
  w.position.copy(m.position); w.rotation.copy(m.rotation); shipGroup.add(w); return m;
}
let steel=new THREE.MeshStandardMaterial({color:0xcccccc,metalness:0.8,roughness:0.35});
let darkSteel=new THREE.MeshStandardMaterial({color:0x333333,metalness:0.8,roughness:0.4});
let whiteMat=new THREE.MeshStandardMaterial({color:0xffffff,metalness:0.3,roughness:0.5});
let redMat=new THREE.MeshStandardMaterial({color:0xff2200,metalness:0.6,roughness:0.4});

let stages=[
 {t:"0: KEEL LAYING",d:"Keel 200m - Backbone"},
 {t:"1: KEEL + FRAMES",d:"Frames - Skeleton"},
 {t:"2: HULL SIDE PLATES",d:"Hull Plates 18mm"},
 {t:"3: BULBOUS BOW",d:"Bow 2.8m - Drag -12%"},
 {t:"4: STERN + RUDDER + PROP",d:"Stern, Prop 5 Blade"},
 {t:"5: DOUBLE BOTTOM + TANKS",d:"Ballast / Fuel Tanks"},
 {t:"6: MAIN DECK + BULKHEADS",d:"Deck 40T/m2"},
 {t:"7: ACCOMMODATION",d:"Apartment 5 Floors"},
 {t:"8: ENGINE ROOM",d:"MAN 8000kW + Pipes"},
 {t:"9: BRIDGE + FUNNEL",d:"Wheelhouse"},
 {t:"10: CARGO + DELIVERY",d:"Final - Ready to Sail"},
];

function build(stage){
  shipGroup.clear();
  // CENTER FIX - Ship ko hamesha 0,0,0 pe rakho
  shipGroup.position.set(0,0,0);
  shipGroup.rotation.set(0,0,0);
  if(stage>=0){
    // Keel - Real beam shape, not box
    let keelGeo=new THREE.BoxGeometry(12,0.35,0.4); let keel=addRealPart(keelGeo, redMat, [0,-1.4,0]);
  }
  if(stage>=1){
    for(let i=-5;i<=5;i++){ let fGeo=new THREE.TorusGeometry(1.1,0.06,8,20,Math.PI); let f=addRealPart(fGeo, steel, [i*1.1,-0.5,0], [0,0,0]); f.rotation.y=Math.PI/2; }
  }
  if(stage>=2){ let hull=createRealHull(curVessel=='tanker'?0x882200:curVessel=='lng'?0xcccccc:0x0066cc); shipGroup.add(hull); }
  if(stage>=3){ let bulb=addRealPart(new THREE.SphereGeometry(0.45,16,16), new THREE.MeshStandardMaterial({color:0x00ffff,metalness:0.7,roughness:0.2}), [6.5,-1,0]); }
  if(stage>=4){ addRealPart(new THREE.CylinderGeometry(0.08,0.08,1.8,10), darkSteel, [-6.5,0,0]); addRealPart(new THREE.CylinderGeometry(0.6,0.6,0.15,20), redMat, [-7.2,-0.5,0], [0,0,Math.PI/2]); }
  if(stage>=5){ addRealPart(new THREE.BoxGeometry(9,0.4,1.4), darkSteel, [0,-1.1,0]); }
  if(stage>=6){ addRealPart(new THREE.BoxGeometry(11,0.15,1.8), steel, [0,1.1,0]); }
  if(stage>=7){ addRealPart(new THREE.BoxGeometry(2.2,2.2,1.4), whiteMat, [-4.2,2.4,0]); }
  if(stage>=8){ addRealPart(new THREE.BoxGeometry(2.2,1.2,1), darkSteel, [-2.5,0.2,0]); addRealPart(new THREE.CylinderGeometry(0.05,0.05,3,8), redMat, [-2,0.5,0.3], [0,0,0.5]); addRealPart(new THREE.CylinderGeometry(0.05,0.05,3,8), new THREE.MeshStandardMaterial({color:0x0000ff}), [-2,0.5,-0.3], [0,0,0.5]); }
  if(stage>=9){ addRealPart(new THREE.BoxGeometry(1.8,0.8,1.1), whiteMat, [-4.2,3.9,0]); addRealPart(new THREE.CylinderGeometry(0.35,0.4,1,14), darkSteel, [-3,3,0]); }
  if(stage>=10){
    if(curVessel=='container') for(let i=0;i<6;i++) for(let h=0;h<2;h++) addRealPart(new THREE.BoxGeometry(0.9,0.45,0.45), new THREE.MeshStandardMaterial({color:h?0x00ff88:0x0088ff,metalness:0.6,roughness:0.4}), [-2+i*1.05,1.8+h*0.5,0]);
    if(curVessel=='tanker') for(let i=0;i<3;i++) addRealPart(new THREE.CylinderGeometry(0.6,0.6,1.5,16), new THREE.MeshStandardMaterial({color:0xff8800,metalness:0.7,roughness:0.3}), [-3+i*2,1.6,0], [0,0,Math.PI/2]);
    if(curVessel=='lng') for(let i=0;i<3;i++) addRealPart(new THREE.SphereGeometry(0.7,20,20), whiteMat, [-3+i*2.5,1.8,0]);
    if(curVessel=='bulk') for(let i=0;i<3;i++) addRealPart(new THREE.BoxGeometry(1.8,0.7,1.2), new THREE.MeshStandardMaterial({color:0x8B4513}), [-3+i*2.2,1.6,0]);
    if(curVessel=='roro') addRealPart(new THREE.BoxGeometry(8,0.6,1.4), whiteMat, [0,1.6,0]);
    if(curVessel=='cruise') for(let i=0;i<4;i++) addRealPart(new THREE.BoxGeometry(8,0.2,1.4), whiteMat, [0,1.7+i*0.35,0]);
  }
  // CUTAWAY - Front ko transparent karo taaki andar dikhe
  if(cut) shipGroup.children.forEach(m=>{ if(m.position.x>0) m.material.transparent=true, m.material.opacity=0.35; });
  if(wire) shipGroup.children.forEach(m=>{ m.material.wireframe=true; });
  // CENTRE ME RAKHO - Bounding box se centre nikalo
  let box=new THREE.Box3().setFromObject(shipGroup);
  let center=box.getCenter(new THREE.Vector3());
  shipGroup.position.sub(center); shipGroup.position.y+=0.5;
  document.getElementById('stageTxt').innerText=stages[stage].t;
  document.getElementById('hud').innerHTML=`<b>${stages[stage].t}</b><br>${stages[stage].d}<br>VESSEL: ${curVessel.toUpperCase()} | Ship is CENTRED<br>Drag = Rotate | Pinch = Zoom`;
  document.getElementById('loading').style.display='none';
  updateLists();
}
function updateLists(){
  let bHTML=`<div class="stage" onclick="setStage(0)">BLOCK 1 - BOW<br>Keel, Stem, Bulbous Bow</div><div class="stage" onclick="setStage(5)">BLOCK 2 - CENTRE<br>Holds, Double Bottom</div><div class="stage" onclick="setStage(7)">BLOCK 3 - ACCOM<br>Apartment, Cabins</div><div class="stage" onclick="setStage(8)">BLOCK 4 - ENGINE<br>Main Engine + Pipes</div><div class="stage" onclick="setStage(4)">BLOCK 5 - STERN<br>Rudder, Prop, Poop Deck</div>`;
  document.getElementById('blockList').innerHTML=bHTML;
  let sHTML=""; stages.forEach((s,i)=>{ sHTML+=`<div class="stage ${i==curStage?'active':''}" onclick="setStage(${i})">${s.t}</div>`; }); document.getElementById('stageList').innerHTML=sHTML;
}
window.setStage=(s)=>{ curStage=s; document.getElementById('slider').value=s; build(s); };
window.setVessel=(v)=>{ curVessel=v; document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('active')); build(curStage); };
window.toggleWire=()=>{ wire=!wire; build(curStage); };
window.toggleCut=()=>{ cut=!cut; build(curStage); };
window.playBuild=()=>{ let i=0; let iv=setInterval(()=>{ setStage(i); i++; if(i>10) clearInterval(iv); },1000); };
document.getElementById('slider').addEventListener('input',e=>setStage(parseInt(e.target.value)));
window.addEventListener('resize',()=>{ renderer.setSize(vp.clientWidth,vp.clientHeight); camera.aspect=vp.clientWidth/vp.clientHeight; camera.updateProjectionMatrix(); });
(function anim(){ requestAnimationFrame(anim); controls.update(); renderer.render(scene,camera); })();
build(0);
</script>
</body>
</html>
