<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOLOGRAM SHIP 5D - 3D Interactive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#020a12;color:#00f3ff;overflow:hidden;height:100vh}
#title{position:fixed;top:0;left:0;right:0;text-align:center;padding:10px;background:rgba(0,10,20,.9);z-index:20;border-bottom:1px solid #00f3ff}
#title h1{font-size:15px;color:#fff;letter-spacing:2px;text-shadow:0 0 10px #00f3ff}
#title p{font-size:10px;color:#8ab4f8;margin-top:2px}
#canvas-box{position:fixed;top:58px;left:0;right:0;bottom:0}
canvas{display:block}
#controls{position:fixed;top:68px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:20;flex-wrap:wrap;justify-content:center;width:100%;padding:0 8px}
#controls button{background:rgba(0,243,255,.1);border:1px solid #00f3ff;color:#00f3ff;padding:7px 11px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer}
#controls button.active,#controls button:hover{background:#00f3ff;color:#000;box-shadow:0 0 15px #00f3ff}
#hint{position:fixed;bottom:165px;left:0;right:0;text-align:center;font-size:11px;color:#8ab4f8;z-index:15;pointer-events:none;text-shadow:0 0 5px #000}
#panel{position:fixed;left:0;right:0;bottom:0;background:rgba(3,18,30,.96);border-top:2px solid #00f3ff;max-height:52vh;overflow-y:auto;padding:14px;z-index:30;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,243,255,.3);display:none}
#panel.show{display:block;animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
#panel h2{color:#fff;font-size:17px}
#panel h2 span{color:#00f3ff;font-size:11px;font-weight:400}
#panel p{color:#d0e0f0;font-size:13px;line-height:1.5;margin-top:6px}
.dim-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.dim-table td,.dim-table th{border:1px solid rgba(0,243,255,.3);padding:6px 8px;text-align:left}
.dim-table th{background:rgba(0,243,255,.15);color:#fff}
.dim-table td{color:#e0f0ff}
.frame-box{margin-top:10px;background:#010d18;border:1px dashed #00f3ff;padding:10px;border-radius:8px}
.frame-box b{color:#ffd700;font-size:12px}
.frame-box p{font-size:12px;color:#a0c8e0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{border:1px solid #00f3ff;padding:4px 9px;border-radius:20px;font-size:11px}
#close{position:absolute;right:12px;top:10px;background:#ff0055;color:#fff;border:none;width:28px;height:28px;border-radius:50%;font-weight:800;cursor:pointer}
#legend{position:fixed;right:8px;top:110px;background:rgba(0,0,0,.6);border:1px solid rgba(0,243,255,.4);padding:8px;border-radius:8px;font-size:10px;z-index:15;line-height:1.8}
</style>
</head>
<body>
<div id="title"><h1>🚢 HOLOGRAM SHIP - 5D INTERACTIVE</h1><p>DRAG TO ROTATE • PINCH TO ZOOM • TAP ANY PART FOR DIMENSION</p></div>
<div id="controls">
<button class="active" onclick="setView('3d',this)">🔄 3D FREE</button>
<button onclick="setView('side',this)">➡️ SIDE</button>
<button onclick="setView('front',this)">⬆️ FRONT</button>
<button onclick="setView('top',this)">⬇️ TOP</button>
<button onclick="toggleSpin(this)">▶️ AUTO ROTATE</button>
</div>
<div id="canvas-box"></div>
<div id="hint">👆 Jahaz ko ghumao • Kisi bhi part pe tap karo</div>
<div id="legend">🔵 Hull / Deck<br>🟣 Accommodation<br>🔴 Engine Room<br>🟢 Fore Peak / EFP<br>🟡 Bow Thruster</div>

<div id="panel">
<button id="close" onclick="closePanel()">X</button>
<h2 id="pTitle"></h2>
<p id="pDesc"></p>
<table class="dim-table" id="pDim"></table>
<div class="frame-box"><b>🏗️ STRUCTURE / FRAME DESIGN</b><p id="pFrame"></p></div>
<div class="frame-box" style="border-color:#ffd700"><b>📐 SECTION VIEW</b><p id="pSection"></p></div>
<div class="tags" id="pTags"></div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const box=document.getElementById('canvas-box');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020a12);
scene.fog=new THREE.Fog(0x020a12,200,450);
const camera=new THREE.PerspectiveCamera(55, innerWidth/(innerHeight-58),0.1,1000);
camera.position.set(110,70,140);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight-58);
box.appendChild(renderer.domElement);
const controls=new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.autoRotate=true; controls.autoRotateSpeed=0.8;
controls.maxDistance=350; controls.minDistance=40;

// Lights
scene.add(new THREE.AmbientLight(0x88ccff,0.8));
const light=new THREE.DirectionalLight(0xffffff,1.2); light.position.set(100,100,100); scene.add(light);

// Materials - Hologram
function holo(color,op=0.45){ return new THREE.MeshBasicMaterial({color, wireframe:true, transparent:true, opacity:op}); }
function solid(color,op=0.15){ return new THREE.MeshBasicMaterial({color, transparent:true, opacity:op, depthWrite:false}); }

const ship=new THREE.Group(); scene.add(ship);
const clickable=[];

function addPart(name, geo, mat, solidMat, pos, rot, data){
  const g=new THREE.Group();
  const w=new THREE.Mesh(geo, mat); const s=new THREE.Mesh(geo, solidMat);
  g.add(w); g.add(s); g.position.set(...pos); if(rot) g.rotation.set(...rot);
  g.userData=data; g.userData.partName=name;
  // store for raycast - set userData on children too
  w.userData.root=g; s.userData.root=g;
  ship.add(g); clickable.push(w,s); return g;
}

const DATA={
 hull:{title:"HULL - Main Ship Body",sub:"Eyres Ch. 7 | SOLAS II-1",desc:"Poora jahaz ka main dhacha. Steel plates se bana, andar transverse + longitudinal framing. Bulbous Bow wave resistance kam karta hai.",dim:[["Length (LOA)","140 m"],["Beam (Breadth)","22 m"],["Depth","12.5 m"],["Draft (Loaded)","8.0 m"],["Plate Thickness","12 - 20 mm AH36 Steel"],["Block Coefficient Cb","0.78"]],frame:"LONGITUDINAL FRAMING: Centre Girder 1200x12mm, Side Longitudinal every 750mm, Transverse Frames every 3000mm (Frame Spacing). Double Bottom Height 1.5m. Shell plating strakes welded.",section:"MIDSHIP SECTION: [Deck 12mm] | [Side Shell 14mm] | [Double Bottom 1.5m] | [Centre Girder] - U-shape cross section, 22m wide, 12.5m deep.",tags:["AH36 Steel","Welded","Longitudinal"]},
 accom:{title:"ACCOMMODATION / SUPERSTRUCTURE",sub:"Eyres Ch.12 | A-60",desc:"Crew rehne, Navigation Bridge, Fire Control Station. 4 Deck tiers. A-60 insulation se fire se protected.",dim:[["Length","18 m"],["Breadth","20 m"],["Height","14 m (4 Decks)"],["Deck Height Each","2.8 m"],["Bulkhead","A-60 Steel 6mm + 50mm Insulation"],["Windows","Toughened Glass"]],frame:"DECKHOUSE FRAME: Pillars + Deck Beams every 2.4m, Bulkhead Stiffeners 100x8 Flat Bar @ 600mm. Wheelhouse top pe wide window.",section:"SIDE VIEW: [Wheelhouse] - [Deck D] - [Deck C] - [Deck B] - [Deck A] - Main Deck. Staircase + lift shaft centre me.",tags:["A-60","Nav Bridge","Fire Station"]},
 engine:{title:"ENGINE ROOM",sub:"Eyres Ch.20 | SOLAS II-2",desc:"Main Engine, Generators, Fire Pumps. Sabse critical zone. CO2 Fixed System se protected.",dim:[["Length","22 m"],["Breadth","20 m"],["Height","10 m (2 Decks)"],["Main Engine","MAN B&W 6S60MC - 12,000 kW"],["Generators","3 x 1200 kW"],["Fire Pumps","2 x Main + 1 Emergency"]],frame:"ENGINE CASING: Heavy transverse bulkheads 12mm, Engine seating - Double bottom strengthened, Foundation girders 800mm high. Vibration dampers.",section:"CROSS SECTION: [Funnel Casing] - [Engine Top] - [Main Engine Block] - [Tank Top / Double Bottom]. Shaft line centre me.",tags:["CO2 System","Main Engine","Fire Pumps"]},
 hold2:{title:"CARGO HOLD NO.2 (AFT)",sub:"Eyres Ch.10",desc:"Aft cargo hold, bulk cargo ke liye. Hopper tanks + hatch cover.",dim:[["Length","28 m"],["Breadth","19 m"],["Depth","10 m"],["Hatch Size","24m x 14m"],["Capacity","4,500 m³"],["Hatch Cover","Hydraulic Folding Steel"]],frame:"HOLD FRAMING: Side Frames 300x12 T-Bar @ 750mm, Hopper Tank 45° sloped, Topside Tank, Transverse Bulkhead corrugated 10mm.",section:"HOLD SECTION: [Hatch Coaming 1.2m] - [Hold Space] - [Hopper Tank 45°] - [Double Bottom]. U-shape.",tags:["Hopper Tank","Hatch Cover","Bulkhead"]},
 hold1:{title:"CARGO HOLD NO.1 (FWD)",sub:"Eyres Ch.10",desc:"Forward hold, pounding / panting se extra strong.",dim:[["Length","28 m"],["Breadth","19 m"],["Depth","10 m"],["Capacity","4,500 m³"],["Panting Stringers","3 Nos."],["Frame Spacing","600mm (Bow Area)"]],frame:"FORWARD FRAMING: Panting Stringers + Breast Hooks, Extra side stringers, Frame spacing reduced to 600mm near bow for pounding load.",section:"FWD SECTION: V-shape hull, narrow bottom, wide deck. Bow flare.",tags:["Pounding","Panting","Ballast"]},
 db:{title:"DOUBLE BOTTOM TANK",sub:"SOLAS II-1 | Eyres Ch.7-8",desc:"Grounding se bachane ke liye 1.5m double bottom. Fuel + Ballast.",dim:[["Height","1.5 m (Min SOLAS)"],["Length","95 m Full Length"],["Centre Girder","1200 x 12 mm"],["Solid Floors","Every 3000mm"],["Capacity Ballast","2,800 Tonnes"]],frame:"DB STRUCTURE: Centre Girder + Side Girders + Solid Floors + Bracket Floors. Manholes 600x400mm. Duct Keel centre me pipe ke liye.",section:"DB SECTION: [Tank Top Plating 12mm] - [1.5m Void] - [Bottom Plating 14mm]. Longitudinal + Transverse.",tags:["Ballast","Fuel Oil","Duct Keel"]},
 fore:{title:"FORE PEAK TANK",sub:"Eyres Ch.9",desc:"Collision Bulkhead ke aage ka tank. Collision me paani yahi rukta hai.",dim:[["Length","12 m"],["Collision Bulkhead","From Keel to Main Deck"],["Plate","14 mm"],["Chain Locker","Inside"]],frame:"FORE END: Collision Bulkhead watertight, Panting beams, Fore peak tank framing - Heavy stringers.",section:"FORE SECTION: Narrow V, Collision Bulkhead vertical.",tags:["Collision Bulkhead","Chain Locker"]},
 efp:{title:"EMERGENCY FIRE PUMP",sub:"SOLAS II-2 Reg 10.2.2",desc:"Engine Room se alag, Fore Peak me. Independent Diesel se chalta hai.",dim:[["Capacity","40 m³/hr"],["Pressure","6 Bar"],["Power","Independent Diesel 80 kW"],["Location","Fwd of Collision Bulkhead"],["Remote Start","From Bridge"]],frame:"ISOLATED COMPARTMENT: A-60 bulkhead, Independent suction from sea chest, Discharge to main fire line.",section:"PUMP ROOM: 3m x 3m x 2.8m isolated box, sea suction below waterline.",tags:["Isolated","Diesel","Bridge Start"]},
 bow:{title:"BOW THRUSTER + BULBOUS BOW",sub:"Hydrodynamics",desc:"Port me bina tug ke ghumne ke liye thruster. Bulb wave kam karta hai.",dim:[["Thruster Tunnel Dia","1.8 m"],["Thruster Power","800 kW"],["Bulb Length","6 m"],["Bulb Dia","3.2 m"],["Fuel Saving by Bulb","12-15%"]],frame:"THRUSTER TUNNEL: Transverse pipe 12mm steel through hull, Thruster unit centre, Grid bars. Bulb - Steel bulb welded to stem.",section:"BOW SECTION: [Bulb below waterline] - [Stem Raked] - [Thruster Tunnel].",tags:["Manoeuvring","Bulbous Bow"]},
 funnel:{title:"FUNNEL / SMOKE STACK",sub:"Eyres Ch.20",desc:"Exhaust gas bahar nikalne ke liye.",dim:[["Height","8 m above Deck"],["Dia","3.5 m"],["Casing","10 mm Steel"]],frame:"FUNNEL CASING: Uptake pipes inside, Insulated.",section:"FUNNEL: Double wall.",tags:["Exhaust","Casing"]},
 mast:{title:"MAST",sub:"Navigation",desc:"Radar, Antenna, Navigation Lights.",dim:[["Height","18 m"],["Dia Base","0.6 m"]],frame:"MAST: Tubular steel, Stay wires.",section:"MAST: Vertical pipe.",tags:["Radar","Antenna"]}
};

// Build 3D Ship
addPart('hull', new THREE.BoxGeometry(120,12,20), holo(0x00f3ff,0.6), solid(0x00f3ff,0.12), [0,6,0], null, DATA.hull);
// Bow - Cone rotated
addPart('bow', new THREE.ConeGeometry(11,28,4), holo(0xffd700,0.7), solid(0xffd700,0.15), [72,6,0], [0,Math.PI/4,-Math.PI/2], DATA.bow);
// Deck
addPart('hold1', new THREE.BoxGeometry(95,2,18), holo(0x00f3ff,0.5), solid(0x00f3ff,0.1), [0,13,0], null, DATA.hold1);
// Accommodation
addPart('accom', new THREE.BoxGeometry(18,14,19), holo(0xff00e0,0.6), solid(0xff00e0,0.15), [-45,20,0], null, DATA.accom);
// Bridge top
addPart('accom', new THREE.BoxGeometry(20,3,20), holo(0xffffff,0.8), solid(0xffffff,0.2), [-45,28,0], null, DATA.accom);
// Funnel
addPart('funnel', new THREE.CylinderGeometry(3,3,12,16), holo(0xff0055,0.7), solid(0xff0055,0.2), [-45,34,0], null, DATA.funnel);
// Engine Room
addPart('engine', new THREE.BoxGeometry(22,9,18), holo(0xff0055,0.7), solid(0xff0055,0.18), [-25,8,0], null, DATA.engine);
// Hold 2
addPart('hold2', new THREE.BoxGeometry(28,10,18), holo(0x00f3ff,0.5), solid(0x00f3ff,0.1), [20,8,0], null, DATA.hold2);
// Double Bottom
addPart('db', new THREE.BoxGeometry(95,3,18), holo(0x00ff66,0.6), solid(0x00ff66,0.15), [0,1.5,0], null, DATA.db);
// Fore Peak
addPart('fore', new THREE.BoxGeometry(12,10,16), holo(0x00ff66,0.6), solid(0x00ff66,0.15), [50,8,0], null, DATA.fore);
// EFP - small cylinder
addPart('efp', new THREE.CylinderGeometry(3,3,4,12), holo(0x00ff66,0.9), solid(0x00ff66,0.3), [50,14,0], null, DATA.efp);
// Mast
addPart('mast', new THREE.CylinderGeometry(0.5,0.8,20,8), holo(0x00f3ff,0.8), solid(0x00f3ff,0.2), [-10,25,0], null, DATA.mast);

// Rings + Grid
const ring=new THREE.Mesh(new THREE.TorusGeometry(85,0.6,8,100), new THREE.MeshBasicMaterial({color:0x00f3ff,transparent:true,opacity:0.7}));
ring.rotation.x=Math.PI/2; ring.position.y=-8; scene.add(ring);
const ring2=new THREE.Mesh(new THREE.TorusGeometry(70,0.4,8,100), new THREE.MeshBasicMaterial({color:0xff00e0,transparent:true,opacity:0.5}));
ring2.rotation.x=Math.PI/2; ring2.position.y=-8; scene.add(ring2);
const grid=new THREE.GridHelper(300,30,0x00f3ff,0x003344); grid.position.y=-10; grid.material.transparent=true; grid.material.opacity=0.35; scene.add(grid);
// Particles
const pGeo=new THREE.BufferGeometry(); const pts=[];
for(let i=0;i<250;i++) pts.push((Math.random()-0.5)*220, Math.random()*90-15, (Math.random()-0.5)*220);
pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({color:0x00f3ff,size:1.3})));

// Click / Tap
const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2();
let selected=null;
function onTap(e){
  const x=(e.clientX||e.touches?.[0]?.clientX); const y=(e.clientY||e.touches?.[0]?.clientY);
  mouse.x=(x/innerWidth)*2-1; mouse.y=-((y-58)/(innerHeight-58))*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(clickable,false);
  if(hits.length){ const root=hits[0].object.userData.root; showInfo(root.userData); }
}
renderer.domElement.addEventListener('click', onTap);
renderer.domElement.addEventListener('touchend', (e)=>{ if(e.changedTouches.length===1) onTap(e.changedTouches[0]); });

function showInfo(d){
  document.getElementById('panel').classList.add('show');
  document.getElementById('pTitle').innerHTML=d.title+' <span>'+d.sub+'</span>';
  document.getElementById('pDesc').innerText=d.desc;
  document.getElementById('pFrame').innerText=d.frame;
  document.getElementById('pSection').innerText=d.section;
  document.getElementById('pDim').innerHTML='<tr><th>PARAMETER</th><th>VALUE</th></tr>'+d.dim.map(r=>'<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td></tr>').join('');
  document.getElementById('pTags').innerHTML=d.tags.map(t=>'<span class="tag">'+t+'</span>').join('');
  document.getElementById('hint').style.display='none';
}
window.closePanel=()=>{ document.getElementById('panel').classList.remove('show'); document.getElementById('hint').style.display='block'; };
window.setView=(v,btn)=>{
  document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  controls.autoRotate=false;
  if(v==='3d') camera.position.set(110,70,140);
  if(v==='side') camera.position.set(0,20,160);
  if(v==='front') camera.position.set(160,20,0);
  if(v==='top') camera.position.set(0,180,0.1);
};
window.toggleSpin=(btn)=>{ controls.autoRotate=!controls.autoRotate; btn.textContent=controls.autoRotate?'⏸️ STOP ROTATE':'▶️ AUTO ROTATE'; btn.classList.toggle('active',controls.autoRotate); };

function animate(){ requestAnimationFrame(animate); ship.position.y=Math.sin(Date.now()*0.001)*1.5; ring.rotation.z+=0.002; controls.update(); renderer.render(scene,camera); }
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/(innerHeight-58); camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight-58); });
// Auto open hull info after 1 sec
setTimeout(()=>showInfo(DATA.hull),800);
</script>
</body>
</html>
