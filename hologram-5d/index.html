<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real Ship GLTF Viewer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#0b1220; font-family:system-ui,sans-serif; color:#e2e8f0; }
  #c { width:100vw; height:100vh; display:block; }
  #ui {
    position:absolute; top:14px; left:14px; z-index:20;
    background:rgba(15,23,42,0.92); border:1px solid #334155;
    padding:14px 16px; border-radius:10px; width:300px;
  }
  #ui h2 { font-size:15px; color:#38bdf8; margin-bottom:6px; }
  #ui p { font-size:12px; opacity:0.85; margin-bottom:10px; line-height:1.4; }
  button {
    margin:3px 3px 0 0; padding:6px 11px; border:none; border-radius:6px;
    background:#1e293b; color:#e2e8f0; cursor:pointer; font-size:12px;
  }
  button:hover { background:#0ea5e9; color:#000; }
  #status {
    position:absolute; bottom:16px; left:16px; z-index:20;
    background:rgba(0,0,0,0.75); padding:8px 14px; border-radius:8px;
    font-size:13px;
  }
  #loading {
    position:absolute; inset:0; background:#0b1220; display:flex;
    align-items:center; justify-content:center; z-index:50;
    font-size:18px; color:#38bdf8;
  }
</style>
</head>
<body>
<div id="loading">Loading real ship model…</div>
<div id="ui">
  <h2>Real Ship GLTF Viewer</h2>
  <p>High-detail model load ho raha hai.<br>
     Mouse se ghumao, scroll se zoom.<br>
     Model file ka naam <b>ship.glb</b> hona chahiye.</p>
  <button onclick="resetCamera()">Reset Camera</button>
</div>
<div id="status">Model loading...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
scene.fog = new THREE.FogExp2(0x0b1220, 0.0008);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 5000);
camera.position.set(180, 80, 220);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Lights
const hemi = new THREE.HemisphereLight(0xb1e1ff, 0x0f172a, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff5e0, 1.4);
sun.position.set(100, 120, 60);
sun.castShadow = true;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x93c5fd, 0.35);
fill.position.set(-80, 40, -60);
scene.add(fill);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 30;
controls.maxDistance = 800;
controls.target.set(0, 15, 0);

// Water plane
const waterGeo = new THREE.PlaneGeometry(2000, 2000);
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x0c4a6e,
  roughness: 0.85,
  metalness: 0.1,
  transparent: true,
  opacity: 0.75
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI / 2;
water.position.y = 0;
scene.add(water);

// ========== LOAD REAL MODEL ==========
const loader = new GLTFLoader();
const status = document.getElementById('status');
const loading = document.getElementById('loading');

loader.load(
  './ship.glb',                    // <-- yahi file name hona chahiye
  (gltf) => {
    const model = gltf.scene;
    
    // Scale adjust (agar model bahut bada/chhota ho)
    model.scale.set(1, 1, 1);
    
    // Center the model
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    model.position.y = -box.min.y;   // keels on water
    
    scene.add(model);
    
    // Auto frame camera
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(maxDim * 1.2, maxDim * 0.5, maxDim * 1.4);
    controls.target.set(0, size.y * 0.3, 0);
    controls.update();
    
    status.textContent = "Model loaded successfully ✓";
    loading.style.display = 'none';
  },
  (xhr) => {
    const pct = xhr.total ? Math.round((xhr.loaded / xhr.total) * 100) : 0;
    status.textContent = `Loading... ${pct}%`;
  },
  (error) => {
    console.error(error);
    status.textContent = "Error: ship.glb nahi mili. File same folder mein rakho.";
    loading.innerHTML = "ship.glb file nahi mili.<br>Download karke same folder mein rakho.";
  }
);

window.resetCamera = function() {
  camera.position.set(180, 80, 220);
  controls.target.set(0, 15, 0);
};

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
