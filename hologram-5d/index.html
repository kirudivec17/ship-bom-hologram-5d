<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIP 5D HOLOGRAM</title>
<style>
body{margin:0;background:#00050a;overflow:hidden;color:#0ff;font-family:monospace}
#top{position:absolute;top:10px;left:10px;border:1px solid #0ff;padding:8px 12px;background:#001118;z-index:10}
canvas{display:block}
#info{position:absolute;bottom:10px;left:10px;background:#001118;border:1px solid #0ff;padding:8px;color:#0ff}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="top">🚢 SHIP-BOM-HOLOGRAM-5D - Drag=Rotate | Scroll=Zoom | Click=Explode | Cost Mode</div>
<div id="info">Loading...</div>
<script>
let scene,camera,renderer,group;
let exploded=false;
let raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();

scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,4,10);
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// Light
scene.add(new THREE.AmbientLight(0x4488aa,1.2));
let dl=new THREE.DirectionalLight(0x00ffff,1); dl.position.set(5,10,5); scene.add(dl);
scene.add(new THREE.GridHelper(20,20,0x003344,0x002233));

// Ship parts as boxes
group=new THREE.Group();
let parts=[
{name:"Keel (Bottom)",color:0xff4400,pos:[0,-1,0],size:[8,0.5,1.5],cost:"₹ 12L"},
{name:"Hull Side Port",color:0x0066ff,pos:[-4,0,0],size:[8,2,0.2],cost:"₹ 18L"},
{name:"Hull Side Stbd",color:0x0066ff,pos:[4,0,0],size:[8,2,0.2],cost:"₹ 18L"},
{name:"Deck Main",color:0xaaaaaa,pos:[0,1.2,0],size:[7,0.2,2.5],cost:"₹ 8L"},
{name:"Engine Room",color:0xffaa00,pos:[0,0,-2],size:[2,1.5,1.5],cost:"₹ 45L"},
{name:"Cabin",color:0xffffff,pos:[0,1.8,1],size:[2,1,1.2],cost:"₹ 15L"},
{name:"Mast",color:0xcccccc,pos:[0,3,0],size:[0.1,3,0.1],cost:"₹ 2L"},
{name:"Anchor 13T",color:0x333333,pos:[0,-0.5,4],size:[0.5,0.5,1],cost:"₹ 22L"},
];

parts.forEach((p,i)=>{
 let g=new THREE.BoxGeometry(...p.size);
 let m=new THREE.MeshPhongMaterial({color:p.color,transparent:true,opacity:0.9});
 let mesh=new THREE.Mesh(g,m);
 mesh.position.set(...p.pos);
 mesh.userData=p; mesh.userData.origPos=new THREE.Vector3(...p.pos);
 group.add(mesh);
});
scene.add(group);

document.getElementById("info").innerHTML="8 Parts Loaded | Total Cost: ₹ 1.4Cr | Click any box";

// Mouse
let isDrag=false, prev={x:0,y:0};
renderer.domElement.addEventListener("mousedown",e=>{isDrag=true; prev={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener("mouseup",()=>isDrag=false);
renderer.domElement.addEventListener("mousemove",e=>{
 if(isDrag){group.rotation.y+=(e.clientX-prev.x)*0.01; group.rotation.x+=(e.clientY-prev.y)*0.01; prev={x:e.clientX,y:e.clientY};}
});
renderer.domElement.addEventListener("click",e=>{
 mouse.x=(e.clientX/window.innerWidth)*2-1; mouse.y=-(e.clientY/window.innerHeight)*2+1;
 raycaster.setFromCamera(mouse,camera);
 let inter=raycaster.intersectObjects(group.children);
 if(inter.length>0){
   let d=inter[0].object.userData;
   document.getElementById("info").innerHTML=`<b>${d.name}</b><br>Cost: ${d.cost}<br>Click again to explode`;
   return;
 }
 exploded=!exploded;
 group.children.forEach((m,i)=>{
   if(exploded) m.position.y+=i*0.6+1;
   else m.position.copy(m.userData.origPos);
 });
});
renderer.domElement.addEventListener("wheel",e=>{camera.position.z+=e.deltaY*0.01;});

function animate(){requestAnimationFrame(animate); renderer.render(scene,camera);} animate();
window.addEventListener("resize",()=>{camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight);});
</script>
</body>
</html>
